[package]
name = "starfall-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "starfall-server"
path = "src/main.rs"

[dependencies]
bincode = "1.3"
game = { path = "../game" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
