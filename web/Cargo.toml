[package]
name = "wasm_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
game = { path = "../game" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
 web-sys = { version = "0.3.104", features = [
    "console",
    "Document",
    "Element",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "KeyboardEvent",
    "Performance",
    "Window",
] }
console_error_panic_hook = "0.1.7"